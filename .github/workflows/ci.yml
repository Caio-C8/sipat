name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      APP_ENV: test
      DATABASE_URL: postgresql://app:app@localhost:5432/app?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify dependency security patches
        run: pnpm security:patches

      - name: Check formatting
        run: pnpm format:check

      - name: Lint, types and tests (including mobile)
        run: pnpm check

      - name: Build
        env:
          NODE_ENV: production
        run: pnpm build

      - name: Build mobile Web health image
        run: >-
          docker build
          --file docker/mobile-web.Dockerfile
          --target ci
          --tag sipat-mobile-web:ci
          .

      - name: Start mobile Web health image
        run: >-
          docker run --detach
          --name sipat-mobile-web-ci
          --publish 127.0.0.1:8081:8080
          sipat-mobile-web:ci

      - name: Check mobile Web health
        run: pnpm --filter @repo/mobile healthcheck:web

      - name: Stop mobile Web health image
        if: always()
        run: docker rm --force sipat-mobile-web-ci

      - name: Install Playwright browser
        run: pnpm --filter @repo/web exec playwright install --with-deps chromium

      - name: End-to-end tests
        env:
          NODE_ENV: production
        run: pnpm --filter @repo/web test:e2e
