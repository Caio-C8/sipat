name: ${COMPOSE_PROJECT_NAME:-sipat}

x-app-environment: &app-environment
  NODE_ENV: ${NODE_ENV}
  APP_ENV: ${APP_ENV}
  APP_NAME: ${APP_NAME}
  APP_VERSION: ${APP_VERSION}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  migrate:
    image: ${COMPOSE_PROJECT_NAME:-sipat}-migration:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: migration
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  api:
    image: ${COMPOSE_PROJECT_NAME:-sipat}-api:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: runner
    environment:
      <<: *app-environment
      API_PORT: ${API_PORT:-3001}
      UPLOADS_ROOT_PATH: /data/uploads
      CORS_ORIGINS: ${CORS_ORIGINS}
      AUTH_RATE_LIMIT_HMAC_SECRET: ${AUTH_RATE_LIMIT_HMAC_SECRET}
      AUTH_ARGON2_MAX_CONCURRENCY: ${AUTH_ARGON2_MAX_CONCURRENCY}
      AUTH_ARGON2_MAX_QUEUE: ${AUTH_ARGON2_MAX_QUEUE}
      AUTH_PASSWORD_RESET_ENABLED: ${AUTH_PASSWORD_RESET_ENABLED:-false}
      AUTH_PASSWORD_RESET_URL: ${AUTH_PASSWORD_RESET_URL:-}
      AUTH_EMAIL_MAX_CONCURRENCY: ${AUTH_EMAIL_MAX_CONCURRENCY:-2}
      AUTH_EMAIL_MAX_QUEUE: ${AUTH_EMAIL_MAX_QUEUE:-100}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PUBLISHED_PORT:-3001}:${API_PORT:-3001}"
    volumes:
      - type: bind
        source: ${UPLOADS_HOST_PATH}
        target: /data/uploads
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "wget", "-qO-", "http://127.0.0.1:${API_PORT:-3001}/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  web:
    image: ${COMPOSE_PROJECT_NAME:-sipat}-web:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        API_INTERNAL_URL: http://api:${API_PORT:-3001}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME}
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV}
    environment:
      <<: *app-environment
      API_INTERNAL_URL: http://api:${API_PORT:-3001}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME}
      NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV}
      PORT: ${WEB_PORT:-3000}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PUBLISHED_PORT:-3000}:${WEB_PORT:-3000}"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "wget", "-qO-", "http://127.0.0.1:${WEB_PORT:-3000}/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  mobile-web:
    profiles: ["mobile-web"]
    image: ${COMPOSE_PROJECT_NAME:-sipat}-mobile-web:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/mobile-web.Dockerfile
      args:
        EXPO_PUBLIC_APP_NAME: ${EXPO_PUBLIC_APP_NAME}
        EXPO_PUBLIC_APP_ENV: ${EXPO_PUBLIC_APP_ENV}
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL}
        EXPO_PUBLIC_API_PORT: ${EXPO_PUBLIC_API_PORT:-3001}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MOBILE_WEB_PUBLISHED_PORT:-8081}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

volumes:
  database_data:

networks:
  internal:
    driver: bridge
