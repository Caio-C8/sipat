packages:
  - "apps/*"
  - "packages/*"

engineStrict: true
injectWorkspacePackages: true
preferWorkspacePackages: true
sharedWorkspaceLockfile: true

allowBuilds:
  "@parcel/watcher": false
  "@prisma/engines": true
  argon2: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@expo/cli@58.1.15 || 58.1.16"
  - "@expo/router-server@58.0.17 || 58.0.18"
  - babel-preset-expo@58.0.20 || 58.0.21
  - expo@58.0.19 || 58.0.20
  - expo-router@58.0.26 || 58.0.27
  - uuid@11.1.1
  - fast-uri@3.1.9
  - body-parser@2.4.0
  - multer@2.5.0
  - vite@8.3.5
  - brace-expansion@2.1.5 || 2.1.6 || 2.1.7 || 5.0.10 || 5.0.11 || 5.0.12
  - source-map-js@1.2.2
  - "@expo/config@58.0.8"
  - "@expo/local-build-cache-provider@58.0.8"
  - "@expo/metro-config@58.0.17 || 58.0.18"
  - "@expo/prebuild-config@58.0.16"
  - expo-file-system@58.0.11 || 58.0.12
  - expo-font@58.0.10
  - expo-modules-autolinking@58.0.15
  - expo-modules-cli@0.3.2 || 0.3.3
  - expo-modules-core@58.0.26 || 58.0.27
  - expo-modules-jsi@58.0.19 || 58.0.20
  - expo-server@58.0.6
  - expo-glass-effect@58.0.5
  - "@expo/fingerprint@0.21.7"

overrides:
  brace-expansion@>=2.0.0 <2.1.5: ^2.1.5
  brace-expansion@>=2.0.0 <2.1.6: ^2.1.6
  brace-expansion@>=2.0.0 <2.1.7: ^2.1.7
  brace-expansion@>=4.0.0 <5.0.10: ^5.0.10
  brace-expansion@>=4.0.0 <5.0.11: ^5.0.11
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
  fast-uri@>=3.0.0 <3.1.9: ^3.1.9
  body-parser@>=2.0.0 <2.4.0: ^2.4.0
  "@nestjs/platform-express>multer": 2.5.0
  vite@>=8.0.0 <8.3.3: ^8.3.5
  "@istanbuljs/load-nyc-config>js-yaml": 4.3.2
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
  uuid@<11.1.1: ^11.1.1

patchedDependencies:
  node-forge@1.4.0: patches/node-forge@1.4.0.patch
  zod@3.25.76: patches/zod@3.25.76.patch
