packages:
  - "apps/*"
  - "packages/*"

engineStrict: true
injectWorkspacePackages: true
preferWorkspacePackages: true
sharedWorkspaceLockfile: true

allowBuilds:
  "@parcel/watcher": false
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@expo/cli@57.0.31"
  - "@expo/router-server@57.0.13"
  - babel-preset-expo@57.0.16
  - expo@57.0.30
  - "@expo/ui@57.0.25"
  - expo-router@57.0.28
  - uuid@11.1.1
  - fast-uri@3.1.6 || 3.1.7 || 3.1.8
  - brace-expansion@2.1.5 || 2.1.6 || 2.1.7 || 5.0.10 || 5.0.11 || 5.0.12
  - source-map-js@1.2.2

overrides:
  brace-expansion@>=2.0.0 <2.1.5: ^2.1.5
  brace-expansion@>=2.0.0 <2.1.6: ^2.1.6
  brace-expansion@>=2.0.0 <2.1.7: ^2.1.7
  brace-expansion@>=4.0.0 <5.0.10: ^5.0.10
  brace-expansion@>=4.0.0 <5.0.11: ^5.0.11
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
  fast-uri@>=3.0.0 <3.1.6: ^3.1.6
  fast-uri@>=3.0.0 <3.1.7: ^3.1.7
  fast-uri@>=3.0.0 <3.1.8: ^3.1.8
  fast-uri@>=3.1.2 <3.1.6: ^3.1.6
  fast-uri@>=3.1.3 <3.1.6: ^3.1.6
  "@istanbuljs/load-nyc-config>js-yaml": 4.3.2
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
  uuid@<11.1.1: ^11.1.1
